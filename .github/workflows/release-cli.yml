name: Release CLI

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      releaseTarget:
        description: 'Select which release part to run'
        required: true
        default: full
        type: choice
        options:
          - full
          - npm-only
          - docker-only
      dockerTag:
        description: 'Optional Docker image tag override (default: github.ref_name)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    if: github.event_name == 'push' || inputs.releaseTarget == 'full' || inputs.releaseTarget == 'npm-only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci --ignore-scripts

      - run: npm run build:core
      - run: npm run build:cli
      - run: npm run test:packages

      - name: Publish @key-lint/core
        run: npm publish --workspace @key-lint/core --access public --provenance

      - name: Publish @key-lint/cli
        run: npm publish --workspace @key-lint/cli --access public --provenance

  docker:
    if: github.event_name == 'push' || inputs.releaseTarget == 'full'
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v4

      - name: Normalize GHCR owner
        id: ghcr
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve Docker tag
        id: docker_meta
        shell: bash
        run: |
          image_tag="${{ github.ref_name }}"
          if [ -n "${{ inputs.dockerTag }}" ]; then
            image_tag="${{ inputs.dockerTag }}"
          fi
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.ghcr.outputs.owner }}/key-lint:latest
            ghcr.io/${{ steps.ghcr.outputs.owner }}/key-lint:${{ steps.docker_meta.outputs.image_tag }}

  docker_only:
    if: github.event_name == 'workflow_dispatch' && inputs.releaseTarget == 'docker-only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize GHCR owner
        id: ghcr
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve Docker tag
        id: docker_meta
        shell: bash
        run: |
          image_tag="${{ github.ref_name }}"
          if [ -n "${{ inputs.dockerTag }}" ]; then
            image_tag="${{ inputs.dockerTag }}"
          fi
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.ghcr.outputs.owner }}/key-lint:latest
            ghcr.io/${{ steps.ghcr.outputs.owner }}/key-lint:${{ steps.docker_meta.outputs.image_tag }}
