name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      signingProfile:
        description: 'Trusted Signing profile to use for manual runs'
        required: true
        default: test
        type: choice
        options:
          - test
          - prod
      runTests:
        description: 'Run unit tests before build on manual runs'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tagVersion -ne $pkgVersion) {
            Write-Error "Tag version '$tagVersion' does not match package.json version '$pkgVersion'."
            exit 1
          }

      - name: Test
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.runTests == 'true'
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Validate Trusted Signing environment
        id: trusted_signing
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME_TEST: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME_TEST }}
        run: |
          $selectedProfile = 'prod'
          if ("${{ github.event_name }}" -eq 'workflow_dispatch') {
            $selectedProfile = "${{ github.event.inputs.signingProfile }}"
          }

          $endpoint = ($env:AZURE_TRUSTED_SIGNING_ENDPOINT ?? '').Trim()
          $accountName = ($env:AZURE_CODE_SIGNING_ACCOUNT_NAME ?? '').Trim()
          $profileName = ($env:AZURE_CERTIFICATE_PROFILE_NAME ?? '').Trim()
          if ($selectedProfile -eq 'test') {
            $profileName = ($env:AZURE_CERTIFICATE_PROFILE_NAME_TEST ?? '').Trim()
          }

          $required = @(
            'AZURE_TENANT_ID',
            'AZURE_CLIENT_ID',
            'AZURE_CLIENT_SECRET',
            'AZURE_TRUSTED_SIGNING_ENDPOINT',
            'AZURE_CODE_SIGNING_ACCOUNT_NAME'
          )

          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ([string]::IsNullOrWhiteSpace($profileName)) {
            $missing += if ($selectedProfile -eq 'test') { 'AZURE_CERTIFICATE_PROFILE_NAME_TEST' } else { 'AZURE_CERTIFICATE_PROFILE_NAME' }
          }

          if ($missing.Count -gt 0) {
            Write-Error ("Missing GitHub Action secrets for Trusted Signing: " + ($missing -join ', '))
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($endpoint)) {
            Write-Error 'AZURE_TRUSTED_SIGNING_ENDPOINT resolved to empty.'
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($accountName)) {
            Write-Error 'AZURE_CODE_SIGNING_ACCOUNT_NAME resolved to empty.'
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($profileName)) {
            Write-Error 'Selected certificate profile name resolved to empty.'
            exit 1
          }

          # Only the (non-secret) profile selector is exported. The signing values themselves stay
          # in secrets and are read directly from the environment in the build step.
          "selected_profile=$selectedProfile" >> $env:GITHUB_OUTPUT

      - name: Show selected signing configuration
        shell: pwsh
        run: |
          Write-Host "Using Trusted Signing profile selector: ${{ steps.trusted_signing.outputs.selected_profile }}"

      - name: Build and publish Windows artifacts
        shell: pwsh
        env:
          # Publish to releases in this repository using the built-in token.
          GH_TOKEN: ${{ github.token }}
          # Azure Trusted Signing (Microsoft) credentials, read by electron-builder itself.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # Signing target, injected into the electron-builder config below.
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ steps.trusted_signing.outputs.selected_profile == 'test' && secrets.AZURE_CERTIFICATE_PROFILE_NAME_TEST || secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
        # electron-builder does not expand `${env.*}` inside `win.azureSignOptions`, so the values
        # are passed as CLI overrides, which are deep-merged into electron-builder.yml.
        # timestampDigest is required: electron-builder 25 does not default it, and signtool
        # rejects /tr without /td ("No file timestamp algorithm specified").
        run: |
          npm run publish:win -- `
            "-c.win.azureSignOptions.endpoint=$env:AZURE_TRUSTED_SIGNING_ENDPOINT" `
            "-c.win.azureSignOptions.codeSigningAccountName=$env:AZURE_CODE_SIGNING_ACCOUNT_NAME" `
            "-c.win.azureSignOptions.certificateProfileName=$env:AZURE_CERTIFICATE_PROFILE_NAME" `
            "-c.win.azureSignOptions.timestampRfc3161=http://timestamp.acs.microsoft.com" `
            "-c.win.azureSignOptions.timestampDigest=SHA256"
