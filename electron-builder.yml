appId: com.wigtertainment.check-i18n
productName: Check i18n
copyright: Copyright © 2026 Wigtertainment Ltd

directories:
  output: release
  buildResources: build

# node_modules of production dependencies are added automatically by electron-builder.
files:
  - app.js
  - package.json
  - dist/check-i18n/browser/**/*

asar: true
forceCodeSigning: true

win:
  # Placeholder artwork - replace build/icon.png with the real icon (>= 256x256).
  # electron-builder converts the PNG to a multi-size .ico.
  icon: build/icon.png
  # electron-builder 25 passes file paths unquoted to Invoke-TrustedSigning, so the executable
  # name must not contain spaces ("Check i18n.exe" breaks Azure Trusted Signing).
  executableName: check-i18n
  # Written to latest.yml/app-update.yml and verified by electron-updater before installing an
  # update. Must match the subject of the code signing certificate.
  publisherName: Wigtertainment Ltd
  # Azure Trusted Signing (Microsoft) is configured by .github/workflows/release-windows.yml via
  # `-c.win.azureSignOptions.*`. The values come from GitHub secrets and cannot live here:
  # electron-builder does not expand `${env.*}` inside azureSignOptions, it forwards the literal
  # string to Invoke-TrustedSigning.
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Check i18n
  artifactName: Check-i18n-Setup-${version}.${ext}

portable:
  artifactName: Check-i18n-Portable-${version}.${ext}

# Releases are published to a dedicated public repository so the main repo can stay private.
# Uploaded as draft: assets only become reachable for electron-updater once the draft is published.
publish:
  provider: github
  owner: Wigtertainment-Ltd
  repo: Check-i18n-releases
  releaseType: draft
  channel: latest
