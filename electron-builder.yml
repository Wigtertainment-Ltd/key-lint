appId: com.wigtertainment.key-lint
productName: KeyLint
copyright: Copyright © 2026 Wigtertainment Ltd

directories:
  output: release
  buildResources: build

# node_modules of production dependencies are added automatically by electron-builder.
files:
  - app.js
  - package.json
  - build/icon.png
  - dist/key-lint/browser/**/*

asar: true
forceCodeSigning: true

win:
  # Multi-size icon (16-256px) generated from build/logo.png by build/generate-icons.ps1.
  icon: build/icon.ico
  # electron-builder 25 passes file paths unquoted to Invoke-TrustedSigning, so the executable
  # name must not contain spaces ("Check i18n.exe" breaks Azure Trusted Signing).
  executableName: key-lint
  # Azure Trusted Signing (Microsoft) is configured by .github/workflows/release-windows.yml via
  # `-c.win.sign.*`. The values come from GitHub secrets and cannot live here.
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: KeyLint
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: KeyLint-Setup-${version}.${ext}

portable:
  artifactName: KeyLint-Portable-${version}.${ext}

# Releases are published to this repository as drafts.
# Assets become reachable for electron-updater once the draft is published.
publish:
  provider: github
  owner: Wigtertainment-Ltd
  repo: key-lint
  releaseType: draft
  channel: latest
