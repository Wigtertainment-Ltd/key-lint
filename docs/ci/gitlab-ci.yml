keylint:
  stage: test
  image: node:20-alpine
  script:
    - npx --yes @key-lint/cli scan . --no-color --quiet
      --max-errors 0
      --output json=keylint-report/keylint.json
      --output markdown=keylint-report/keylint.md
      --output html=keylint-report/site/index.html
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - keylint-report/
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
