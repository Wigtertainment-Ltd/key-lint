keylint:
  stage: test
  image: node:20-alpine
  variables:
    KEYLINT_MR_COMMENT: 'true'
  resource_group: keylint-$CI_MERGE_REQUEST_IID
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'
  script:
    - |
      scan_exit=0
      npx --yes @key-lint/cli scan . --no-color --quiet \
        --max-errors 0 \
        --output json=keylint-report/keylint.json \
        --output markdown=keylint-report/keylint.md \
        --output html=keylint-report/site/index.html || scan_exit=$?

      comment_exit=0
      KEYLINT_EXIT_CODE="$scan_exit" node ./docs/ci/comment-gitlab.cjs || comment_exit=$?
      if [ "$scan_exit" -ne 0 ]; then
        exit "$scan_exit"
      fi
      exit "$comment_exit"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - keylint-report/
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
