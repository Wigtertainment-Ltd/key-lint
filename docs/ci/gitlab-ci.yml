keylint:
  stage: test
  image: node:26-alpine
  resource_group: keylint-$CI_MERGE_REQUEST_IID
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'
  script:
    - npx --yes @key-lint/cli scan . --no-color --quiet --pr-comment
      --max-errors 0
      --output json=keylint-report/keylint.json
      --output markdown=keylint-report/keylint.md
      --output html=keylint-report/site/index.html
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - keylint-report/
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
