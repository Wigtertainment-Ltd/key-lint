name: i18n

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  keylint:
    runs-on: ubuntu-latest
    outputs:
      site-exists: ${{ steps.site.outputs.exists }}
      site-directory: ${{ steps.i18n.outputs.site-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - id: i18n
        uses: Wigtertainment-Ltd/key-lint/packages/action@v1
        with:
          path: .
          max-errors: '0'
          ignore: |
            LEGACY.**

      - name: Check for a publishable report
        id: site
        if: always()
        shell: bash
        env:
          HTML_REPORT: ${{ steps.i18n.outputs.html-report }}
        run: |
          if [ -n "${HTML_REPORT}" ] && [ -f "${HTML_REPORT}" ]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      # Pull requests retain an ordinary downloadable CI artifact and cannot
      # replace the stable Pages deployment.
      - name: Upload CI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keylint-report
          path: keylint-report/
          if-no-files-found: warn

  prepare-pages:
    name: Prepare GitHub Pages artifact
    needs: keylint
    if: >-
      ${{ always() && needs.keylint.outputs.site-exists == 'true' &&
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
    steps:
      - name: Download generated reports
        uses: actions/download-artifact@v4
        with:
          name: keylint-report
          path: keylint-report

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ needs.keylint.outputs.site-directory }}

  deploy:
    name: Deploy report to GitHub Pages
    needs: prepare-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
