name: i18n

on:
  pull_request:
  push:
    branches: [main]

jobs:
  keylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Option A: the packaged composite action
      - id: i18n
        uses: Wigtertainment-Ltd/key-lint/packages/action@v1
        with:
          path: .
          max-errors: '0'
          ignore: |
            LEGACY.**

      # Option B: call the CLI directly
      # - run: npx --yes @key-lint/cli scan . --no-color --max-errors 0
      #     --output json=keylint-report/keylint.json
      #     --output markdown=keylint-report/keylint.md

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keylint-report
          path: keylint-report/
