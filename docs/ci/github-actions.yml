name: i18n

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Option A: the packaged composite action
      - id: i18n
        uses: Wigtertainment-Ltd/Check-i18n/packages/action@v1
        with:
          path: .
          max-errors: '0'
          ignore: |
            LEGACY.**

      # Option B: call the CLI directly
      # - run: npx --yes @check-i18n/cli scan . --no-color --max-errors 0
      #     --output json=check-i18n-report/check-i18n.json
      #     --output markdown=check-i18n-report/check-i18n.md

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-i18n-report
          path: check-i18n-report/
