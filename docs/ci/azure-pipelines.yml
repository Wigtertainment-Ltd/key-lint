trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'

  - script: |
      npx --yes @key-lint/cli scan . --no-color --quiet \
        --max-errors 0 \
        --output json=$(Build.ArtifactStagingDirectory)/keylint.json \
        --output markdown=$(Build.ArtifactStagingDirectory)/keylint.md
    displayName: KeyLint scan

  - script: |
      echo "##vso[task.uploadsummary]$(Build.ArtifactStagingDirectory)/keylint.md"
    condition: always()
    displayName: Publish KeyLint summary

  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      PathtoPublish: $(Build.ArtifactStagingDirectory)
      ArtifactName: keylint-report
