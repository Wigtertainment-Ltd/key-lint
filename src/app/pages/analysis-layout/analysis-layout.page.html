<div class="scan-layout" [class.sidebar-collapsed]="isSidebarCollapsed">
	<aside class="side-nav" [class.collapsed]="isSidebarCollapsed">
		<div class="brand">
			<h1 class="brand-full">i18n Analyzer</h1>
			<h1 class="brand-compact" title="i18n Analyzer">iA</h1>
			<p>v2.4.0-stable</p>
		</div>

		<button class="new-analysis-btn" type="button" (click)="startNewAnalysis()" title="New Analysis">
			<span class="material-symbols-outlined">add</span>
			<span class="label">New Analysis</span>
		</button>

		<nav class="nav-links">
			<a
				class="nav-item"
				title="Dashboard"
				routerLink="/analysis/dashboard"
				routerLinkActive="active"
				[routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }"
			>
				<span class="material-symbols-outlined">dashboard</span>
				<span class="label">Dashboard</span>
			</a>
			<a
				class="nav-item"
				title="Translation Keys"
				routerLink="/analysis/translation-keys"
				routerLinkActive="active"
				[routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }"
			>
				<span class="material-symbols-outlined">translate</span>
				<span class="label">Translation Keys</span>
			</a>
			<a
				class="nav-item"
				title="Analysis Results"
				routerLink="/analysis/results"
				routerLinkActive="active"
				[routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }"
			>
				<span class="material-symbols-outlined">analytics</span>
				<span class="label">Analysis Results</span>
			</a>
			<a
				class="nav-item"
				title="History"
				routerLink="/analysis/history"
				routerLinkActive="active"
				[routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }"
			>
				<span class="material-symbols-outlined">history</span>
				<span class="label">History</span>
			</a>
		</nav>

		<div class="side-bottom">
			<a
				class="nav-item"
				title="Documentation"
				routerLink="/analysis/documentation"
				routerLinkActive="active"
				[routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }"
			>
				<span class="material-symbols-outlined">menu_book</span>
				<span class="label">Documentation</span>
			</a>
			<a class="nav-item" title="Support">
				<span class="material-symbols-outlined">contact_support</span>
				<span class="label">Support</span>
			</a>
		</div>
	</aside>

	<main class="main-content">
		<header class="top-bar">
			<div class="top-left">
				<button class="menu-toggle-btn" type="button" (click)="toggleSidebar()" [attr.aria-expanded]="!isSidebarCollapsed" aria-label="Toggle menu" title="Toggle menu">
					<span class="material-symbols-outlined">menu</span>
				</button>

				<div class="project-info">
				<h4 [title]="displayProjectPath">Project: {{ displayProjectName }}</h4>
				<span class="last-scan-chip">Last Scan: {{ lastScanText }}</span>
				</div>
			</div>

			<div class="top-right">
				<button
					type="button"
					class="theme-toggle"
					aria-label="Toggle theme"
					(click)="toggleTheme()"
					title="Toggle theme"
				>
					<span class="material-symbols-outlined">{{ isDark ? 'light_mode' : 'dark_mode' }}</span>
				</button>

				<div class="toolbar-icons">
					<span class="material-symbols-outlined">notifications</span>
					<a
						class="toolbar-icon-btn"
						title="History"
						routerLink="/analysis/history"
						routerLinkActive="active"
						[routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }"
					>
						<span class="material-symbols-outlined">history</span>
					</a>
				</div>
			</div>
		</header>

		<section class="content-shell" [class.edge-to-edge]="isEdgeToEdgeContent">
			<router-outlet></router-outlet>
		</section>
	</main>
</div>
